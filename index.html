<style>

olid var(--line);background:var(--s);color:var(--t2);border-radius:999px;padding:5px 9px;font-size:10px}.card{background:linear-gradient(180deg,var(--s2),var(--s));border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:10px}.card.hero{background:linear-gradient(135deg,#6b9cff21,#d8b46a12),var(--s);border-color:#2d4160}.card h3{font-size:10px;letter-spacing:1.4px;color:var(--t3);margin:0 0 10px}.kv{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid #ffffff0b}.kv:last-child{border-bottom:0}.kv .k{width:92px;color:var(--t3);font-size:12px}.kv .v{flex:1;text-align:right;color:var(--t2);font-size:13px;overflow-wrap:anywhere}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 6px;text-align:center}.stat b{display:block;font-size:17px}.stat span{color:var(--t3);font-size:8px}.storypage{overflow:hidden!important}.storyscroll{flex:1;overflow-y:auto;padding:14px 12px 8px;-webkit-overflow-scrolling:touch}.storywrap{max-width:850px;margin:auto}.storycard{padding:16px 15px;margin-bottom:10px;border-radius:15px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}.storycard.narrative{background:linear-gradient(180deg,#d8b46a0d,#ffffff05);border:1px solid #d8b46a29;border-left:3px solid var(--gold);font-family:var(--serif);font-size:15px}.storycard.player{margin-left:auto;max-width:86%;background:#101c2b;border:1px solid #263d59;border-right:3px solid var(--cyan);font-size:13px;text-align:right}.storycard.system{padding:9px 11px;background:transparent;border:1px dashed var(--line);color:var(--t3);font-size:10px}.eyebrow{display:block;font-family:var(--font);font-size:8px;letter-spacing:2px;color:var(--gold);margin-bottom:6px}.dock{background:linear-gradient(180deg,#090d141a,var(--bg) 20%);padding:5px 10px calc(9px + env(safe-area-inset-bottom))}.quickrow{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:3px 0 8px}.quickrow::-webkit-scrollbar{display:none}.quick{white-space:nowrap;border:1px solid #2b4960;background:#0e1924;color:var(--cyan);border-radius:999px;padding:7px 12px;font-size:12px}.composer{display:flex;align-items:flex-end;gap:8px}.composer textarea{flex:1;min-width:0;min-height:44px;max-height:110px;resize:none;border:1px solid var(--line);border-radius:13px;background:var(--s);padding:10px 11px;outline:none}.send{height:44px;min-width:70px;border:0;border-radius:13px;background:linear-gradient(135deg,#79d7f8,#7197ff);color:#071018;font-weight:800}.bottomnav{min-height:58px;padding:5px 5px calc(5px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);gap:2px;border-top:1px solid #ffffff0f;background:#090d14f5;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.navbtn{border:0;background:transparent;color:var(--t3);border-radius:11px;padding:5px 2px;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:2px}.navbtn i{font-style:normal;font-size:18px}.navbtn.active{color:var(--cyan);background:#6ccdf412}.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tab{border:1px solid var(--line);background:var(--s);color:var(--t3);border-radius:999px;padding:6px 11px}.tab.active{border-color:#385d79;color:var(--cyan)}.beast{display:flex;gap:10px;align-items:center;padding:11px;background:var(--s);border:1px solid var(--line);border-radius:13px;margin-bottom:8px}.avatar{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:24px}.meta{flex:1}.meta b{display:block}.meta small,.map small,.notice{color:var(--t3);font-size:11px;line-height:1.7}.map{position:relative;padding:13px 13px 13px 44px;background:var(--s);border:1px solid var(--line);border-radius:14px;margin-bottom:9px}.map .dot{position:absolute;left:13px;top:13px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#132334;border:1px solid #2e516b;font-size:11px}.map.current{border-color:#3a6685;background:linear-gradient(135deg,#6ccdf414,var(--s))}.setting label,.setup label{display:block;font-size:10px;color:var(--t3);margin:11px 0 5px}.setting input,.setting select,.setup input,.setup textarea,.setup select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;outline:none}.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid var(--line);background:var(--s3);color:var(--t2);border-radius:10px;padding:8px 12px}.btn.primary{border-color:#3a6685;color:var(--cyan)}.btn.danger{border-color:#603a43;color:var(--red)}.slot{padding:11px;border:1px solid var(--line);border-radius:13px;background:var(--s);margin-bottom:8px}.slot small{display:block;color:var(--t3);margin-top:3px}.setup{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 13px calc(22px + env(safe-area-inset-bottom))}.setupbox{width:min(660px,100%);margin:auto}.setuphead{text-align:center;padding:12px 0 18px}.setuphead h1{margin:0;color:var(--gold);font-size:28px;font-family:var(--serif)}.setuphead p{margin:5px 0;color:var(--t3);font-size:11px}.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode{padding:12px;border:1px solid var(--line);background:var(--s);border-radius:13px;text-align:left}.mode.on{border-color:#3a6685;background:#0e1b28}.mode b{display:block}.mode small{color:var(--t3)}.toast{position:fixed;z-index:200;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-10px);opacity:0;background:var(--s3);border:1px solid var(--line2);border-radius:999px;padding:8px 13px;font-size:11px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:390px){.chip.loc{display:none}.brand small{display:none}.navbtn{font-size:8px}.navbtn i{font-size:17px}}
</style></head><body>
<div id="app"><header class="topbar"><div class="brand">高武御兽<small>HTML V0.1 · ALPHA</small></div><div class="grow"></div><div class="chip" id="timeChip"><b>--:--</b></div><div class="chip loc" id="locChip">📍 --</div><button class="iconbtn" onclick="switchPage('settings')">⚙︎</button></header>
<main class="viewport"><section class="page storypage active" id="page-story"><div class="storyscroll" id="storyScroll"><div class="storywrap" id="story"></div></div><div class="dock"><div class="quickrow" id="quick"></div><div class="composer"><textarea id="input" rows="1" placeholder="你打算做什么？"></textarea><button class="send" id="sendBtn" onclick="act()">行动</button></div></div></section><section class="page" id="page-player"><div class="inner" id="playerContent"></div></section><section class="page" id="page-beasts"><div class="inner" id="beastsContent"></div></section><section class="page" id="page-map"><div class="inner" id="mapContent"></div></section><section class="page" id="page-bag"><div class="inner" id="bagContent"></div></section><section class="page" id="page-save"><div class="inner" id="saveContent"></div></section><section class="page" id="page-settings"><div class="inner" id="settingsContent"></div></section></main>
<nav class="bottomnav"><button class="navbtn active" data-page="story" onclick="switchPage('story',this)"><i>📖</i>剧情</button><button class="navbtn" data-page="player" onclick="switchPage('player',this)"><i>👤</i>人物</button><button class="navbtn" data-page="beasts" onclick="switchPage('beasts',this)"><i>🐾</i>御兽</button><button class="navbtn" data-page="map" onclick="switchPage('map',this)"><i>🗺️</i>地图</button><button class="navbtn" data-page="bag" onclick="switchPage('bag',this)"><i>🎒</i>背包</button><button class="navbtn" data-page="save" onclick="switchPage('save',this)"><i>💾</i>存档</button></nav></div>
<div class="setup" id="setup"><div class="setupbox"><div class="setuphead"><h1>高武御兽</h1><p>建立存档 · 军训第一日</p></div><div class="card hero"><h3>玩家设定</h3><label>姓名</label><input id="name" placeholder="输入你的名字"><label>性别</label><select id="gender"><option>男</option><option>女</option><option>其他</option></select><label>自定义设定（可选）</label><textarea id="note" rows="4" placeholder="外貌、性格、偏好、战斗倾向……"></textarea></div><div class="card"><h3>本命兽生成方式</h3><div class="modegrid"><button class="mode on" id="semi" onclick="setMode('semi')"><b>半随机候选</b><small>输入偏好，由内容池 / AI 给出合法候选。</small></button><button class="mode" id="random" onclick="setMode('random')"><b>纯随机抽取</b><small>从正式御兽池按项目既定概率抽取。</small></button></div><label>本命偏好</label><textarea id="pref" rows="3" placeholder="例如：速度快、帅、偏输出，不要纯辅助。"></textarea></div><button class="btn primary" style="width:100%;padding:12px;font-weight:800" onclick="startGame()">开始游戏</button><p class="notice">V0.1 仍是开发版。当前先把移动端 UI、模型兼容和开局骨架跑稳。</p></div></div><div class="toast" id="toast"></div>
<script>
'use strict';const $=id=>document.getElementById(id),KEY='gwysh_state_v01',LEGACY='gwysh_v0',CFG='gwysh_cfg_v2';let mode='semi',busy=false;
const init=()=>({version:'0.1',world:{date:'2038-09-01',time:'07:20',period:'早晨',location:'家'},player:{name:'',gender:'男',note:'',humanLv:1,humanExp:0,trainerExp:0,contractTier:1,hp:100,hpMax:100,weapon:'未选择',specialization:'未选择',stats:{hp:100,patk:10,pdef:10,satk:10,sdef:10,spd:100},skills:[]},beasts:{mode:'semi',preference:'',active:[],storage:[],storageCap:50},inventory:{money:0,balls:0,items:[]},story:{flags:{arrived_school:false,awakening_done:false,first_battle_done:false},recent:[]},quick:['出门前往学校','检查觉醒通知','查看个人资料']});let state=init();
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function migrate(v){let d=init();return {...d,...v,world:{...d.world,...v.world},player:{...d.player,...v.player,stats:{...d.player.stats,...(v.player?.stats||{})}},beasts:{...d.beasts,...v.beasts},inventory:{...d.inventory,...v.inventory},story:{...d.story,...v.story,flags:{...d.story.flags,...(v.story?.flags||{})}},quick:v.quick||d.quick,version:'0.1'}}function load(){for(const k of [KEY,LEGACY]){try{let v=JSON.parse(localStorage.getItem(k)||'null');if(v)return migrate(v)}catch{}}return null}function cfg(){let d={endpoint:'https://api.deepseek.com/v1/chat/completions',apiKey:'',model:'deepseek-v4-flash',reasoning:'off',temperature:.9};try{return {...d,...JSON.parse(localStorage.getItem(CFG)||'{}')}}catch{return d}}function toast(t){let e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._h);e._h=setTimeout(()=>e.classList.remove('show'),2200)}
function entry(t,type='narrative'){let d=document.createElement('div');d.className='storycard '+type;d.innerHTML=(type==='narrative'?'<span class="eyebrow">NARRATIVE</span>':'')+esc(t).replace(/\n/g,'<br>');$('story').appendChild(d);requestAnimationFrame(()=>$('storyScroll').scrollTop=$('storyScroll').scrollHeight)}function renderTop(){$('timeChip').innerHTML='<b>'+esc(state.world.time)+'</b>';$('locChip').textContent='📍 '+state.world.location}function renderQuick(){$('quick').innerHTML='';(state.quick||[]).forEach(q=>{let b=document.createElement('button');b.className='quick';b.textContent=q;b.onclick=()=>act(q);$('quick').appendChild(b)})}
function renderPlayer(){let p=state.player,s=p.stats;$('playerContent').innerHTML=`<div class="title"><div><h1>${esc(p.name||'人物')}</h1><p>御兽师 · Human Lv ${p.humanLv}</p></div><span class="badge">契位 ${p.contractTier}</span></div><div class="card hero"><h3>成长</h3><div class="kv"><div class="k">Human EXP</div><div class="v">${p.humanExp}</div></div><div class="kv"><div class="k">职业经验</div><div class="v">${p.trainerExp}</div></div><div class="kv"><div class="k">主武器</div><div class="v">${esc(p.weapon)}</div></div><div class="kv"><div class="k">专精</div><div class="v">${esc(p.specialization)}</div></div></div><div class="card"><h3>战斗六维</h3><div class="grid3">${[['HP',s.hp],['物攻',s.patk],['物防',s.pdef],['术攻',s.satk],['术防',s.sdef],['速度',s.spd]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div></div><div class="card"><h3>技能 / 装备</h3><p class="notice">觉醒后逐步解锁。这里以后管理装备、技能库和 4+1 战斗配置。</p></div>`}
function renderBeasts(){let b=state.beasts,slots=b.active.length?b.active.map((x,i)=>`<div class="beast"><div class="avatar">${i===0?'✦':'🐾'}</div><div class="meta"><b>${esc(x.name||x.species||'未命名')}</b><small>Lv ${x.level||1} · ${esc(x.rank||'未知阶位')}</small></div></div>`).join(''):`<div class="card hero"><h3>命契未觉醒</h3><p class="notice">你的第一个位置属于终身唯一的本命兽。军训第一日统一觉醒仪式会开启这里。</p></div>`;$('beastsContent').innerHTML=`<div class="title"><div><h1>御兽</h1><p>随行、仓库与图鉴</p></div><span class="badge">${b.storage.length}/${b.storageCap}</span></div><div class="tabs"><button class="tab active">随行队伍</button><button class="tab">仓库</button><button class="tab">图鉴</button></div>${slots}<div class="card"><h3>本命生成</h3><div class="kv"><div class="k">模式</div><div class="v">${b.mode==='semi'?'半随机候选':'纯随机抽取'}</div></div><div class="kv"><div class="k">偏好</div><div class="v">${esc(b.preference||'无')}</div></div></div>`}
function renderMap(){let cur=state.world.location,nodes=[['家','起始地点 / 走读生活','第一灵武高中 · 35分钟','🏠'],['第一灵武高中','军训、觉醒、课程、训练','家 · 35分钟','🏫'],['商业街','尚未解锁','学校 · 时间TBD','🏙️'],['御兽师协会','尚未解锁','市区节点','◆']];$('mapContent').innerHTML=`<div class="title"><div><h1>地图</h1><p>${state.world.date} · ${state.world.period}</p></div><span class="badge">${esc(cur)}</span></div>`+nodes.map(n=>`<div class="map ${cur===n[0]?'current':''}"><div class="dot">${n[3]}</div><b>${n[0]}${cur===n[0]?' · 当前':''}</b><small>${n[1]}<br>${n[2]}</small></div>`).join('')+`<div class="card"><p class="notice">地图采用地点节点 + 真实分钟，不做 2D 走图或移动动画。</p></div>`}
function renderBag(){let i=state.inventory;$('bagContent').innerHTML=`<div class="title"><div><h1>背包</h1><p>随身物品与资源</p></div></div><div class="card"><h3>资源</h3><div class="kv"><div class="k">货币</div><div class="v">${i.money}</div></div><div class="kv"><div class="k">收容球</div><div class="v">${i.balls}</div></div></div><div class="card"><h3>物品</h3><p class="notice">${i.items.length?i.items.map(esc).join('、'):'暂无物品'}</p></div>`}function sk(n){return'gwysh_slot_'+n}function gs(n){try{return JSON.parse(localStorage.getItem(sk(n))||'null')}catch{return null}}
function renderSave(){let h=`<div class="title"><div><h1>存档</h1><p>自动存档 + 6 个手动档</p></div></div><div class="slot"><b>自动存档</b><small>${esc(state.player.name||'玩家')} · ${state.world.date} ${state.world.time} · ${state.world.location}</small><div class="rowbtns"><button class="btn" onclick="loadAuto()">读取当前自动档</button></div></div>`;for(let n=1;n<=6;n++){let s=gs(n);h+=`<div class="slot"><b>手动档 ${n}</b><small>${s?`${esc(s.player?.name||'玩家')} · ${esc(s.world?.date||'')} ${esc(s.world?.time||'')} · ${esc(s.world?.location||'')}`:'空'}</small><div class="rowbtns"><button class="btn primary" onclick="manualSave(${n})">保存</button>${s?`<button class="btn" onclick="manualLoad(${n})">读取</button><button class="btn danger" onclick="manualDelete(${n})">删除</button>`:''}</div></div>`}$('saveContent').innerHTML=h}
function renderSettings(){let c=cfg(),custom=!['deepseek-v4-flash','deepseek-v4-pro'].includes(c.model);$('settingsContent').innerHTML=`<div class="title"><div><h1>设置</h1><p>AI API 与开发选项</p></div><span class="badge">DeepSeek V4</span></div><div class="card setting hero"><h3>AI 模型</h3><label>API Endpoint</label><input id="ep" value="${esc(c.endpoint)}"><label>API Key</label><input id="key" type="password" value="${esc(c.apiKey)}" placeholder="sk-..."><label>模型</label><select id="model" onchange="toggleCustom()"><option value="deepseek-v4-flash" ${c.model==='deepseek-v4-flash'?'selected':''}>DeepSeek V4 Flash · 推荐</option><option value="deepseek-v4-pro" ${c.model==='deepseek-v4-pro'?'selected':''}>DeepSeek V4 Pro · 更强</option><option value="__custom__" ${custom?'selected':''}>自定义模型 ID</option></select><input id="customModel" style="margin-top:7px;display:${custom?'block':'none'}" value="${custom?esc(c.model):''}" placeholder="自定义模型 ID"><label>思考模式</label><select id="reason"><option value="off" ${c.reasoning==='off'?'selected':''}>关闭 · 日常剧情推荐</option><option value="high" ${c.reasoning==='high'?'selected':''}>High · 复杂裁判</option><option value="max" ${c.reasoning==='max'?'selected':''}>Max · 最强推理</option></select><label>Temperature</label><input id="temp" type="number" min="0" max="2" step="0.1" value="${Number(c.temperature??.9)}"><div class="rowbtns"><button class="btn primary" onclick="saveSettings()">保存</button><button class="btn" onclick="testAI()">测试连接</button></div></div><div class="card"><h3>兼容说明</h3><p class="notice">旧 deepseek-chat / deepseek-reasoner 已退役。默认使用 deepseek-v4-flash；V4 Flash / Pro 继续走 OpenAI ChatCompletions。思考模式使用 reasoning_effort=high/max。</p></div><div class="card"><h3>存档维护</h3><button class="btn danger" onclick="clearGame()">清空当前游戏并重建存档</button></div>`}
function renderAll(){renderTop();renderQuick();renderPlayer();renderBeasts();renderMap();renderBag();renderSave();renderSettings()}function switchPage(n){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('page-'+n).classList.add('active');document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.page===n));if(n==='player')renderPlayer();if(n==='beasts')renderBeasts();if(n==='map')renderMap();if(n==='bag')renderBag();if(n==='save')renderSave();if(n==='settings')renderSettings()}function setMode(m){mode=m;$('semi').classList.toggle('on',m==='semi');$('random').classList.toggle('on',m==='random')}
function startGame(){state=init();state.player.name=$('name').value.trim()||'玩家';state.player.gender=$('gender').value;state.player.note=$('note').value.trim();state.beasts.mode=mode;state.beasts.preference=$('pref').value.trim();$('setup').style.display='none';$('story').innerHTML='';entry(`今天是第一灵武高中军训第一日，也是统一命契觉醒的日子。\n\n如果这个世界只是抓宠、打联盟、收集徽章，那事情倒简单了。\n\n可惜不是。\n\n异兽已经进入文明的每个角落，而所谓“御兽师”也从来不是躲在后面发号施令的人。练武、术式、实战、契约、培养——哪一项都逃不掉。\n\n07:20。\n\n你该出门了。`);entry(`角色：${state.player.name} · 本命模式：${state.beasts.mode==='semi'?'半随机候选':'纯随机抽取'}`,'system');save();renderAll();switchPage('story')}
function addMin(n){let[h,m]=state.world.time.split(':').map(Number),t=h*60+m+n;h=Math.floor(t/60)%24;m=t%60;state.world.time=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');state.world.period=h<6?'凌晨':h<9?'早晨':h<12?'上午':h<14?'中午':h<18?'下午':h<22?'晚上':'深夜'}
async function act(given){if(busy)return;let text=(given||$('input').value).trim();if(!text)return;$('input').value='';entry(text,'player');if(text.includes('学校')&&!state.story.flags.arrived_school){addMin(35);state.world.location='第一灵武高中';state.story.flags.arrived_school=true;state.quick=['进入校门','看看新生指引','观察周围同学'];entry(`三十五分钟后，你站在第一灵武高中的校门前。\n\n今天的人流比平时密得多。新生、家长、负责秩序的教师，还有几只体型夸张到明显不该出现在普通校园里的异兽混在一起。\n\n远处广播正在提醒新生尽快前往集合区。\n\n统一命契觉醒，就在今天。`);save();renderAll();return}let c=cfg();if(!c.apiKey){entry('【本地模式】行动已经记录。进入「设置」填写 API Key 后，AI 会接手软剧情和 NPC 叙事。','system');save();return}await callAI(text,c)}
async function callAI(text,c){busy=true;$('sendBtn').disabled=true;entry('AI 正在推演这一幕……','system');let sys=`你是《高武御兽》网页游戏的叙事层。程序状态是真实事实源。你负责小说化叙事、NPC对白、氛围与软事件；不得擅自改变等级、EXP、HP、日期、地点、技能、物品、御兽、契位、战斗结果；不得替玩家做关键选择。现代高武×御兽×校园养成；玩家默认拥有蓝星文化视角，可偶尔使用泛化第四面墙梗，但不要把转生史做严肃主线。输出2-5段中文小说叙事，轻快、有爽感但不要油腻。最后严格输出：\n可选行动：选项1｜选项2｜选项3\n当前状态：${JSON.stringify({world:state.world,player:{name:state.player.name,gender:state.player.gender,humanLv:state.player.humanLv},beasts:state.beasts.active,flags:state.story.flags})}`;let body={model:c.model,messages:[{role:'system',content:sys},...state.story.recent.slice(-10),{role:'user',content:text}],temperature:Number(c.temperature)||.9};if(c.reasoning==='high'||c.reasoning==='max')body.reasoning_effort=c.reasoning;try{let r=await fetch(c.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.apiKey},body:JSON.stringify(body)});if(!r.ok)throw Error('HTTP '+r.status+' '+(await r.text()).slice(0,140));let j=await r.json(),out=j?.choices?.[0]?.message?.content||'',p=out.split(/\n?可选行动[:：]\s*/);entry((p[0]||out).trim());if(p[1])state.quick=p[1].split('｜').map(x=>x.trim()).filter(Boolean).slice(0,5);state.story.recent.push({role:'user',content:text},{role:'assistant',content:out});if(state.story.recent.length>24)state.story.recent=state.story.recent.slice(-24);save();renderAll()}catch(e){entry('AI 请求失败：'+e.message,'system')}finally{busy=false;$('sendBtn').disabled=false}}
function toggleCustom(){$('customModel').style.display=$('model').value==='__custom__'?'block':'none'}function readSettings(){let m=$('model').value;return{endpoint:$('ep').value.trim(),apiKey:$('key').value.trim(),model:m==='__custom__'?$('customModel').value.trim():m,reasoning:$('reason').value,temperature:Number($('temp').value||.9)}}function saveSettings(){let c=readSettings();if(!c.model)return toast('请输入模型 ID');localStorage.setItem(CFG,JSON.stringify(c));toast('AI 设置已保存');renderSettings()}async function testAI(){let c=readSettings();if(!c.apiKey)return toast('先填 API Key');toast('正在测试…');let body={model:c.model,messages:[{role:'user',content:'只回复 OK'}],max_tokens:16};if(c.reasoning==='high'||c.reasoning==='max')body.reasoning_effort=c.reasoning;try{let r=await fetch(c.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.apiKey},body:JSON.stringify(body)});if(!r.ok)throw Error('HTTP '+r.status);toast('连接成功')}catch(e){toast('连接失败：'+e.message)}}function manualSave(n){localStorage.setItem(sk(n),JSON.stringify(state));toast('已保存到档位 '+n);renderSave()}function manualLoad(n){let s=gs(n);if(!s)return;state=migrate(s);save();renderAll();switchPage('story');entry('已读取手动档 '+n,'system')}function manualDelete(n){localStorage.removeItem(sk(n));toast('已删除档位 '+n);renderSave()}function loadAuto(){let s=load();if(!s)return;state=s;renderAll();switchPage('story');entry('已读取自动存档','system')}function clearGame(){if(!confirm('确定清空当前自动存档并重新开始？手动档不会删除。'))return;localStorage.removeItem(KEY);localStorage.removeItem(LEGACY);location.reload()}$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();act()}});let old=load();if(old){state=old;$('setup').style.display='none';entry('自动存档已恢复。','system');entry(`你现在位于：${state.world.location}。`);renderAll()}else renderAll();
</script></body></html>
