<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee9df"><title>高武御兽 · UI V2</title><style>
:root{--paper:#eee9df;--paper2:#f8f5ee;--ink:#25262a;--muted:#77736b;--line:#d7d0c4;--red:#a94c43;--gold:#a88750;--night:#242936;--shadow:0 16px 44px #332b201f;--serif:"Songti SC","STSong",serif;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans)}button,input,textarea{font:inherit}button{-webkit-tap-highlight-color:transparent}.app{height:100vh;height:100dvh;position:relative;overflow:hidden;background:var(--paper)}.screen{position:absolute;inset:0;display:none;overflow:hidden;background:var(--paper);animation:in .22s ease}.screen.on{display:block}@keyframes in{from{opacity:.3;transform:translateX(10px)}to{opacity:1;transform:none}}.hud{position:absolute;z-index:8;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:flex-start;color:#fff;text-shadow:0 1px 8px #0008;pointer-events:none}.hud .date{font-family:var(--serif);font-size:13px;line-height:1.5}.hud .place{font-size:10px;opacity:.8}.menu{pointer-events:auto;margin-left:auto;width:38px;height:38px;border:0;border-radius:50%;background:#17191d88;color:#fff;font-size:18px;backdrop-filter:blur(10px)}.scene{height:100%;position:relative;background:linear-gradient(160deg,#85949a 0%,#c8bca8 45%,#756f66 100%)}.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 25%,#fff8 0 6%,transparent 25%),linear-gradient(180deg,transparent 35%,#191714aa 100%)}.room-art{position:absolute;inset:0;overflow:hidden}.window{position:absolute;right:9%;top:15%;width:42%;height:29%;border:8px solid #6f685e;background:linear-gradient(#a9d1df,#e8dfc5 62%,#7e9277 63%);box-shadow:0 0 50px #fff8}.desk{position:absolute;left:7%;top:44%;width:48%;height:9%;background:#75604c;border-radius:3px;box-shadow:0 90px 0 -40px #51463b}.bed{position:absolute;right:-4%;bottom:25%;width:58%;height:20%;background:#d .portrait{height:220px;border-radius:4px;background:linear-gradient(145deg,#c8c0b3,#7e8b8b);position:relative;overflow:hidden;margin-bottom:22px;box-shadow:var(--shadow)}.portrait:after{content:"人物立绘区域";position:absolute;inset:auto 0 18px;text-align:center;color:#fff9;font-size:11px;letter-spacing:3px}.name{text-align:center;font-family:var(--serif);font-size:25px}.level{text-align:center;color:var(--muted);font-size:11px;margin:4px 0 22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:24px}.stat{text-align:center}.stat b{display:block;font-family:var(--serif);font-size:20px;font-weight:500}.stat span{font-size:9px;color:var(--muted)}.sectiontitle{text-align:center;font-size:10px;letter-spacing:4px;color:var(--muted);margin:25px 0 14px}.equip{display:grid;grid-template-columns:1fr 1fr;gap:10px}.slot{padding:14px 10px;border-bottom:1px solid var(--line)}.slot small{display:block;color:var(--muted);font-size:9px}.beastHero{text-align:center;padding:12px 0}.orb{width:150px;height:150px;margin:5px auto 16px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f7d2a0,#b65a45 45%,#67382f 72%);box-shadow:0 18px 40px #7d493344;display:grid;place-items:center;font-size:58px}.bond{display:flex;justify-content:center;gap:28px;color:var(--muted);font-size:11px;margin:12px}.hp{max-width:330px;margin:18px auto}.bar{height:5px;background:#d8d1c6;border-radius:8px;overflow:hidden}.bar i{display:block;width:88%;height:100%;background:#6f8c69}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}.softbtn{border:1px solid var(--line);background:#f8f5ee;padding:13px;border-radius:3px;color:var(--ink)}.dots{text-align:center;margin-top:20px;letter-spacing:9px;color:#aaa}.mapPage{background:#ded6c6;position:relative;min-height:100%}.mapCanvas{height:68vh;min-height:500px;position:relative;background:radial-gradient(circle at 25% 20%,#f5eddb 0 8%,transparent 9%),linear-gradient(35deg,#b9c4aa 0 30%,#d6c8aa 31% 57%,#aeb9a7 58%);overflow:hidden}.mapCanvas:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(28deg,transparent 0 48px,#766e5d16 49px 51px)}.node{position:absolute;z-index:2;border:0;background:transparent;text-align:center;color:#35342f}.node i{display:grid;width:54px;height:54px;margin:auto;place-items:center;border-radius:50%;background:#f8f4e8;border:2px solid #85765e;box-shadow:0 7px 18px #4d45382b;font-style:normal;font-size:24px}.node b{display:block;font-family:var(--serif);font-size:12px;margin-top:5px}.node.home{left:42%;top:54%}.node.school{left:56%;top:18%}.node.shop{left:13%;top:39%}.node.park{right:8%;top:47%}.node.lock{opacity:.48}.mapSheet{position:absolute;z-index:6;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:#f8f5eef2;backdrop-filter:blur(12px);border-radius:18px;padding:18px;box-shadow:var(--shadow);transform:translateY(130%);transition:.25s}.mapSheet.on{transform:none}.mapSheet h2{font-family:var(--serif);font-size:19px;margin:0}.mapSheet p{font-size:11px;color:var(--muted);line-height:1.7}.go{width:100%;border:0;background:var(--ink);color:#fff;padding:12px;border-radius:10px}.drawer{position:absolute;z-index:30;inset:0 0 0 auto;width:min(330px,88%);background:#f8f5ee;box-shadow:-15px 0 50px #0003;padding:calc(20px + env(safe-area-inset-top)) 20px;transform:translateX(105%);transition:.24s}.drawer.on{transform:none}.drawer h2{font-family:var(--serif)}.drawer button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:15px 4px;color:var(--ink)}.dim{position:absolute;z-index:29;inset:0;background:#0004;display:none}.dim.on{display:block}.hint{text-align:center;color:var(--muted);font-size:10px;margin-top:22px}@media(min-width:700px){.storybox{padding-left:max(8vw,30px);padding-right:max(8vw,30px)}.page{padding-left:max(20vw,30px);padding-right:max(20vw,30px)}}
</style></head><body><div class="app">
<section class="screen on" id="storyScreen"><div class="scene"><div class="room-art"><div class="window"></div><div class="desk"></div><div class="bed"></div></div><div class="hud"><div class="date">9月1日 · 07:20<div class="place">家 · 卧室</div></div><button class="menu" onclick="drawer(true)">☰</button></div><div class="storybox" id="storyBox" onclick="nextStory()"><div class="chapter">军训第一日</div><div class="storytext" id="storyText"></div><div class="continue" id="continue">点击继续 ›</div></div><div class="choices" id="choices"><button class="choice primary" onclick="choose('前往学校')">前往学校</button><button class="choice" onclick="choose('检查觉醒通知')">检查觉醒通知</button><button class="choice" onclick="choose('再检查一下行李')">再检查一下行李</button><button class="choice free" onclick="freeInput()">✦ 我想做别的</button></div><div class="composer" id="composer"><textarea rows="2" id="freeText" placeholder="描述你想做的事……"></textarea><button onclick="submitFree()">确定</button></div></div></section>
<section class="screen" id="playerScreen"><div class="page"><div class="pagehead"><button class="back" onclick="show('story')">‹</button><div><h1>角色</h1><div class="sub">御兽师档案</div></div></div><div class="portrait"></div><div class="name">林默</div><div class="level">Human Lv. 1 · 新生</div><div class="stats"><div class="stat"><b>10</b><span>体魄</span></div><div class="stat"><b>10</b><span>术式</span></div><div class="stat"><b>100</b><span>速度</span></div></div><div class="sectiontitle">当前装备</div><div class="equip"><div class="slot"><small>主武器</small>未选择</div><div class="slot"><small>护具</small>训练服</div></div><div class="sectiontitle">技能</div><div class="equip"><div class="slot">基础格斗</div><div class="slot">空位</div><div class="slot">空位</div><div class="slot">空位</div></div><div class="hint">详细数值在需要时再展开，不让信息淹没角色。</div></div></section>
<section class="screen" id="beastScreen"><div class="page"><div class="pagehead"><button class="back" onclick="show('story')">‹</button><div><h1>御兽</h1><div class="sub">本命契 · 尚未正式觉醒</div></div></div><div class="beastHero"><div class="orb">?</div><div class="name">未显化</div><div class="level">觉醒仪式将在今天进行</div><div class="bond"><span>♡ 亲密 —</span><span>◆ 契合 —</span></div><div class="hp"><div class="bar"><i></i></div></div></div><div class="actions"><button class="softbtn">技能</button><button class="softbtn">培养</button><button class="softbtn">解析</button><button class="softbtn">装备</button></div><div class="dots">● ○ ○ ＋</div></div></section>
<section class="screen" id="mapScreen"><div class="mapPage"><div class="pagehead" style="position:absolute;z-index:8;top:calc(12px + env(safe-area-inset-top));left:18px"><button class="back" onclick="show('story')">‹</button><div><h1>城区</h1><div class="sub">点击地点查看行程</div></div></div><div class="mapCanvas"><button class="node home" onclick="place('家','当前位置','你居住的小区。')"><i>⌂</i><b>家</b></button><button class="node school" onclick="place('第一灵武高中','35 分钟 · 8.2 km','军训、命契觉醒、课程与训练。')"><i>校</i><b>第一灵武高中</b></button><button class="node shop lock" onclick="place('商业街','尚未解锁','完成入学流程后开放。')"><i>街</i><b>商业街</b></button><button class="node park lock" onclick="place('城市公园','尚未解锁','附近偶尔有低阶异兽活动。')"><i>林</i><b>公园</b></button></div><div class="mapSheet" id="mapSheet"><h2 id="placeName"></h2><p id="placeMeta"></p><p id="placeDesc"></p><button class="go" onclick="show('story')">前往</button></div></div></section>
<div class="dim" id="dim" onclick="drawer(false)"></div><aside class="drawer" id="drawer"><h2>高武御兽</h2><button onclick="show('player');drawer(false)">角色</button><button onclick="show('beast');drawer(false)">御兽</button><button onclick="show('map');drawer(false)">地图</button><button>背包</button><button>存档</button><button>设置</button><p class="hint">UI Prototype V2 · 先定交互与视觉，不接正式系统。</p></aside></div><script>
const lines=['今天是第一灵武高中军训的第一天。\n\n也是统一命契觉醒的日子。','如果这个世界只是抓宠、挑战联盟、收集徽章……\n\n事情倒简单了。','可惜不是。\n\n这个大陆什么设定都融。御兽师本人要练武，异兽能进化，术式与科技并存——而你，一个从蓝星投胎过来的倒霉蛋，今天终于要觉醒自己的本命兽。','时间已经不早了。\n\n你该去学校了。'];let idx=0;const $=x=>document.getElementById(x);$('storyText').textContent=lines[0];function nextStory(){if($('choices').classList.contains('on')||$('composer').classList.contains('on'))return;if(idx<lines.length-1){idx++;$('storyText').animate([{opacity:.2,transform:'translateY(5px)'},{opacity:1,transform:'none'}],{duration:220});$('storyText').textContent=lines[idx];if(idx===lines.length-1){$('continue').style.display='none';setTimeout(()=>{$('storyBox').style.display='none';$('choices').classList.add('on')},250)}}}function choose(x){$('choices').classList.remove('on');$('storyBox').style.display='block';$('storyText').textContent=x==='前往学校'?'你抓起东西出了门。\n\n清晨的风从街道尽头吹来。三十五分钟后，第一灵武高中的校门会出现在你面前。':'你花了几分钟处理这件事。真正重要的觉醒仪式仍在等着你。';$('continue').style.display='block'}function freeInput(){$('choices').classList.remove('on');$('composer').classList.add('on');$('freeText').focus()}function submitFree(){let t=$('freeText').value.trim();if(!t)return;$('composer').classList.remove('on');$('storyBox').style.display='block';$('storyText').textContent='你决定：'+t+'\n\n【原型阶段：这里以后交给 AI 意图解析与叙事层。】';$('continue').style.display='block';$('freeText').value=''}function show(n){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(n+'Screen').classList.add('on')}function drawer(v){$('drawer').classList.toggle('on',v);$('dim').classList.toggle('on',v)}function place(n,m,d){$('placeName').textContent=n;$('placeMeta').textContent=m;$('placeDesc').textContent=d;$('mapSheet').classList.add('on')}
</script></body></html>
