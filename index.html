<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>高武御兽 V0.0</title>
<style>
:root{--bg:#0b0f16;--s:#121824;--e:#182131;--b:#28364a;--t:#eef4fb;--t2:#aebed2;--a:#7bd7ff;--g:#e6bf72}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea{font:inherit}#app{height:100dvh;display:grid;grid-template-rows:48px 1fr 64px}.top{display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--s);border-bottom:1px solid var(--b)}.logo{font-weight:800;color:var(--g)}.sp{flex:1}.pill,.btn{border:1px solid var(--b);background:var(--e);color:var(--t2);border-radius:9px;padding:7px 10px}.main{display:flex;flex-direction:column;min-height:0}.story{flex:1;overflow:auto;padding:12px}.entry{padding:12px;margin:0 0 10px;border-radius:12px;line-height:1.8;background:var(--e);border-left:3px solid var(--g)}.player{border-left-color:var(--a);text-align:right}.quick{display:flex;gap:7px;overflow:auto;padding:6px 10px}.quick button{white-space:nowrap;border:1px solid #315b72;background:var(--e);color:var(--a);border-radius:20px;padding:7px 12px}.input{display:flex;gap:8px;padding:8px 10px 10px;background:var(--s);border-top:1px solid var(--b)}textarea{flex:1;resize:none;min-height:42px;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:9px;padding:9px}.send{border:0;background:#5ea6ff;color:#07111c;font-weight:800;border-radius:9px;padding:0 16px}.nav{display:flex;justify-content:space-around;align-items:center;background:var(--s);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}.nav button{background:none;border:0;color:var(--t2);font-size:11px;padding:8px}.overlay{display:none;position:fixed;inset:0;background:#000a;z-index:30;padding:14px;align-items:center;justify-content:center}.overlay.show{display:flex}.modal{width:min(680px,100%);max-height:85vh;overflow:auto;background:var(--s);border:1px solid var(--b);border-radius:16px;padding:14px}.card{background:var(--e);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;color:var(--t2)}.setup{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;padding:22px 14px}.setupbox{max-width:640px;margin:auto}.setup h1{color:var(--g);text-align:center}.setup input,.setup textarea{width:100%;margin:6px 0 12px;background:var(--s);color:var(--t);border:1px solid var(--b);border-radius:9px;padding:10px}.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode button{padding:12px;border:1px solid var(--b);background:var(--e);color:var(--t);border-radius:12px}.mode button.on{border-color:var(--a);color:var(--a)}@media(max-width:600px){.pill.hide{display:none}.mode{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <div class="top"><div class="logo">高武御兽</div><div class="sp"></div><div class="pill" id="time">07:20</div><div class="pill hide" id="loc">📍 家</div><button class="btn" onclick="openPanel('settings')">⚙️</button></div>
  <div class="main"><div class="story" id="story"></div><div class="quick" id="quick"></div><div class="input"><textarea id="input" placeholder="输入你的行动…"></textarea><button class="send" onclick="act()">行动</button></div></div>
  <div class="nav"><button onclick="openPanel('player')">👤<br>人物</button><button onclick="openPanel('beasts')">🐾<br>御兽</button><button onclick="openPanel('map')">🗺️<br>地图</button><button onclick="openPanel('bag')">🎒<br>背包</button><button onclick="openPanel('save')">💾<br>存档</button></div>
</div>
<div class="overlay" id="ov" onclick="if(event.target===this)closePanel()"><div class="modal"><div id="panel"></div><button class="btn" onclick="closePanel()">关闭</button></div></div>
<div class="setup" id="setup"><div class="setupbox"><h1>高武御兽</h1><div class="card"><h3>建立存档</h3><input id="name" placeholder="玩家姓名"><textarea id="note" rows="4" placeholder="外貌 / 个性 / 战斗倾向（可选）"></textarea><div class="mode"><button id="semi" class="on" onclick="mode='semi';syncMode()">半随机候选</button><button id="random" onclick="mode='random';syncMode()">纯随机抽取</button></div><textarea id="pref" rows="3" placeholder="本命兽偏好，例如：速度快、帅、不要纯辅助"></textarea><button class="btn" style="width:100%;margin-top:8px;color:var(--a)" onclick="startGame()">开始游戏</button></div></div></div>
<script>
const $=id=>document.getElementById(id);let mode='semi';
const KEY='gwysh_v0';const CFG='gwysh_cfg';
let state={world:{date:'2038-09-01',time:'07:20',period:'早晨',location:'家'},player:{name:'',note:'',humanLv:1,humanExp:0,trainerExp:0,contractTier:1,hp:100,weapon:'未选择'},beasts:{mode:'semi',preference:'',active:[],storage:[],storageCap:50},inventory:{money:0,balls:0,items:[]},story:{flags:{arrived_school:false,awakening_done:false},recent:[]},quick:['出门前往学校','检查觉醒通知','查看个人资料']};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function entry(t,cls=''){let d=document.createElement('div');d.className='entry '+cls;d.innerHTML=esc(t).replace(/\n/g,'<br>');$('story').appendChild(d);$('story').scrollTop=$('story').scrollHeight}
function render(){ $('time').textContent=state.world.time; $('loc').textContent='📍 '+state.world.location; $('quick').innerHTML='';state.quick.forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>act(x);$('quick').appendChild(b)}) }
function syncMode(){$('semi').classList.toggle('on',mode==='semi');$('random').classList.toggle('on',mode==='random')}
function startGame(){state.player.name=$('name').value.trim()||'玩家';state.player.note=$('note').value.trim();state.beasts.mode=mode;state.beasts.preference=$('pref').value.trim();$('setup').style.display='none';entry('今天是第一灵武高中军训第一日，也是统一命契觉醒的日子。\n\n如果这个世界只是抓宠、打联盟、收集徽章，那倒简单了。可惜这里御兽师本人也要练武、学术式、参加实战。\n\n现在先别迟到。');render();save()}
function addMin(n){let [h,m]=state.world.time.split(':').map(Number);let t=h*60+m+n;state.world.time=String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
async function act(x){let text=(x||$('input').value).trim();if(!text)return;$('input').value='';entry(text,'player');if(text.includes('学校')){addMin(35);state.world.location='第一灵武高中';state.story.flags.arrived_school=true;state.quick=['进入校门','查看新生指引','观察周围同学'];entry('三十五分钟后，第一灵武高中的校门出现在视野里。今天真正重要的事只有一个：觉醒。');render();save();return}let cfg=getCfg();if(!cfg.apiKey){entry('【本地模式】行动已记录。配置 AI API 后，这里会由模型继续生成剧情。');save();return}try{let sys='你是《高武御兽》网页游戏的叙事层。程序状态是真实事实源，不得擅自改变等级、EXP、HP、物品、御兽、技能、日期和地点。玩家拥有行动权。请用2-4段中文小说叙事回应，并在最后给出：可选行动：A｜B｜C。当前状态：'+JSON.stringify(state);let r=await fetch(cfg.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.apiKey},body:JSON.stringify({model:cfg.model,messages:[{role:'system',content:sys},{role:'user',content:text}]})});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();let c=j?.choices?.[0]?.message?.content||'';let p=c.split(/\n?可选行动[:：]\s*/);entry(p[0]||c);if(p[1])state.quick=p[1].split('｜').map(s=>s.trim()).filter(Boolean).slice(0,5);render();save()}catch(e){entry('AI 请求失败：'+e.message)}}
function getCfg(){try{return Object.assign({endpoint:'https://api.deepseek.com/v1/chat/completions',apiKey:'',model:'deepseek-chat'},JSON.parse(localStorage.getItem(CFG)||'{}'))}catch{return {endpoint:'https://api.deepseek.com/v1/chat/completions',apiKey:'',model:'deepseek-chat'}}}
function openPanel(t){let h='';if(t==='player')h=`<h2>人物</h2><div class=card><div class=row><span>姓名</span><b>${esc(state.player.name)}</b></div><div class=row><span>Human Lv</span><b>${state.player.humanLv}</b></div><div class=row><span>契位</span><b>${state.player.contractTier}</b></div><div class=row><span>主武器</span><b>${esc(state.player.weapon)}</b></div></div>`;if(t==='beasts')h=`<h2>御兽</h2><div class=card>随行：${state.beasts.active.length?state.beasts.active.map(x=>esc(x.name||x.species)).join('、'):'尚未觉醒'}<br>仓库：${state.beasts.storage.length}/${state.beasts.storageCap}<br>模式：${state.beasts.mode==='semi'?'半随机候选':'纯随机抽取'}</div>`;if(t==='map')h=`<h2>地图</h2><div class=card>🏠 家 → 🏫 第一灵武高中：35分钟</div><div class=card>当前：${esc(state.world.location)}</div>`;if(t==='bag')h=`<h2>背包</h2><div class=card>货币 ${state.inventory.money}<br>收容球 ${state.inventory.balls}<br>物品 ${state.inventory.items.length||0}</div>`;if(t==='save')h=`<h2>存档</h2><div class=card>自动存档已启用。当前版本先保存到浏览器 localStorage。</div><button class=btn onclick="localStorage.removeItem(KEY);location.reload()">新游戏 / 清档</button>`;if(t==='settings'){let c=getCfg();h=`<h2>AI 设置</h2><div class=card><input id=ep value="${esc(c.endpoint)}" placeholder="API Endpoint"><input id=key type=password value="${esc(c.apiKey)}" placeholder="API Key"><input id=model value="${esc(c.model)}" placeholder="模型"><button class=btn onclick="localStorage.setItem(CFG,JSON.stringify({endpoint:$('ep').value,apiKey:$('key').value,model:$('model').value}));closePanel()">保存</button></div>`}$('panel').innerHTML=h;$('ov').classList.add('show')}
function closePanel(){$('ov').classList.remove('show')}
let old=load();if(old){state=old;$('setup').style.display='none';entry('自动存档已恢复。');render()}
</script>
</body>
</html>
